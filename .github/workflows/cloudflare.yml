name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: chk
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 未設定，略過 Cloudflare 部署（Settings → Secrets and variables → Actions）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stamp script versions (cache busting)
        if: steps.chk.outputs.skip == 'false'
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s/__BUILD__/$V/g" schedule.html index.html
      - name: Deploy
        if: steps.chk.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=mk-monthly --branch=main --commit-dirty=true
